name: Publish images

on:
  workflow_call:
    inputs:
      version: { required: true, type: string }
      channel: { required: true, type: string }
      ref: { required: true, type: string }

permissions:
  contents: read
  packages: write

jobs:
  # Each platform builds natively and pushes by digest; the merge job names the
  # result. Development channels are amd64 only; releases add native arm64.
  # Docker images cover the panel and runtime services — never the CLI (npm).
  build:
    name: Build ${{ matrix.image.name }} image (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: Portta, image: portta, file: apps/web/Dockerfile }
        platform: ${{ fromJSON(inputs.channel == 'release' && '[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]' || '[{"arch":"amd64","runner":"ubuntu-24.04"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Generate runtime VERSION
        run: printf '%s\n' '${{ inputs.version }}' > VERSION
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.file }}
          target: runtime
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            PORTTA_VERSION=${{ inputs.version }}
            PORTTA_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.image }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.image }}-${{ matrix.platform.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests_${{ matrix.image.image }}_${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.name }} image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Portta
            image: portta
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests_${{ matrix.image }}_*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha=${SHA:0:7}
          if [ "$CHANNEL" = release ]; then
            tags=("$IMAGE:$VERSION" "$IMAGE:sha-$short_sha")
          else
            # The installed runtime pulls exactly $VERSION (packages/cli/src/context.ts).
            tags=("$IMAGE:$VERSION" "$IMAGE:$CHANNEL" "$IMAGE:$CHANNEL-$short_sha" "$IMAGE:sha-$short_sha")
          fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]/#/--tag=}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
