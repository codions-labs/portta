<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%235b67d8' d='M4 3h12v4h-2V5H6v14h8v-2h2v4H4z'/%3E%3Cpath fill='%235b67d8' d='m15 8 5 4-5 4v-3H9v-2h6z'/%3E%3C/svg%3E" />
    <title>Protected access · Portta</title>
    <script>
      (() => {
        var stored
        try {
          stored = localStorage.getItem('portta-theme')
        } catch {}
        var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
        var dark = theme === 'dark'
        if (theme === 'system') {
          try {
            dark = matchMedia('(prefers-color-scheme: dark)').matches
          } catch {}
        }
        var root = document.documentElement
        root.classList.remove('light', 'dark')
        root.classList.add(dark ? 'dark' : 'light')
        root.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <!--PORTTA_AUTH_CONTEXT-->
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
