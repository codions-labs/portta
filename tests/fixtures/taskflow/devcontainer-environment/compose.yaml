services:
  backend:
    build: ./backend
    command: node /app/server.mjs
    volumes:
      - .:/workspaces/taskflow-poc
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 2s
      timeout: 1s
      retries: 20
  frontend:
    build: ./frontend
    command: node /app/server.mjs
    expose: ["3000"]
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: taskflow
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 1s
      retries: 20
